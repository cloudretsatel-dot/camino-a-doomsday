<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060d0a">
<title>Camino a Doomsday</title>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doomsday">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: expediente de misión en una columna. Cabecera con cielo de estrellas, anillo y cuenta atrás;
   filtros fijos; ruta vertical que se ilumina al ver títulos, con tarjetas grandes de portada animada;
   ficha inferior por título con deslizar entre títulos. */
:root{
  --bg:#060d0a;
  --panel:#0e1813;
  --line:#1f3329;
  --text:#eef6f0;
  --muted:#8fa89a;
  --signal:#2bdc78;
  --gold:#b6ffd2;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5}
body{min-height:100%;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:620px;margin:0 auto}

/* ---------- Cabecera ---------- */
.hero{position:relative;overflow:hidden;padding:max(20px,env(safe-area-inset-top)) 16px 20px;
  background:
    radial-gradient(120% 70% at 85% -10%, rgba(43,220,120,.34), transparent 60%),
    radial-gradient(90% 60% at 0% 10%, rgba(20,160,110,.16), transparent 60%),
    linear-gradient(#07120d,#060d0a)}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero>*:not(canvas):not(.rune){position:relative}
.eyebrow{font:800 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--signal);margin:0;animation:rise .7s var(--ease) both}
.hero h1{font:900 clamp(46px,14vw,68px)/.88 var(--f-display);text-transform:uppercase;margin:8px 0 18px;text-wrap:balance;animation:rise .8s .08s var(--ease) both}
.hero h1 span{background:linear-gradient(100deg,#1fbf6b,#c9ffe0,#1fbf6b);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stats{display:flex;align-items:center;gap:18px;animation:rise .8s .16s var(--ease) both}
.ring{position:relative;width:122px;height:122px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .track{stroke:var(--line)}
.ring .fg{stroke:url(#rg);transition:stroke-dashoffset 1.1s var(--ease);filter:drop-shadow(0 0 7px rgba(43,220,120,.7))}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display)}
.ring-c b{font-size:44px;line-height:.9;font-weight:900}
.ring-c small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ring.done .ring-c b{color:var(--gold)}
.ring.done .fg{filter:drop-shadow(0 0 12px rgba(182,255,210,.95))}
.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
.remain{min-width:0}
.lbl{display:block;font:700 12px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hrs{font:900 clamp(40px,12vw,54px)/1 var(--f-display);margin:6px 0 4px;font-variant-numeric:tabular-nums;transform-origin:left center}
.hrs i{font-style:normal;font-size:.48em;color:var(--muted);margin:0 .28em 0 .08em;letter-spacing:.04em}
.pace{margin:0;font-size:13.5px;color:var(--muted);text-wrap:balance}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 8px;animation:rise .8s .24s var(--ease) both}
.cd div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;text-align:center;overflow:hidden}
.cd b{display:block;font:900 clamp(30px,9vw,40px)/1 var(--f-display);font-variant-numeric:tabular-nums}
.cd b.roll{animation:roll .45s var(--ease)}
@keyframes roll{from{opacity:0;transform:translateY(-55%)}to{opacity:1;transform:none}}
.cd small{font:700 11px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cd-label{margin:0;font-size:13px;color:var(--muted);text-align:center}
.cd-label strong{color:var(--text);font-weight:600}
.go{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:9px 16px 9px 9px;border-radius:20px;text-align:left;
  border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 30%,#0e1813),#0e1813 75%);
  box-shadow:0 10px 30px -12px var(--c);transition:transform .25s var(--ease)}
.hero .go{animation:rise .8s .32s var(--ease) both}
.go:active{transform:scale(.97)}
.go-art{flex:none;width:46px;height:60px;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.go-art svg{display:block;width:100%;height:100%}
.go-t{min-width:0;flex:1}
.go-t small{display:block;font:800 11px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.go-t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font:800 20px/1.05 var(--f-display);text-transform:uppercase;overflow:hidden}
.go-arrow{flex:none;width:30px;height:30px;color:var(--c);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* ---------- Filtros ---------- */
.filters{position:sticky;top:0;z-index:6;display:flex;gap:6px;padding:10px 12px;background:rgba(6,13,10,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.chip{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 8px;white-space:nowrap;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted);transition:background .25s,color .25s,border-color .25s,transform .2s}
.chip:active{transform:scale(.95)}
.chip em{font-style:normal;font:800 13px/1 var(--f-display);letter-spacing:.06em;background:var(--line);color:var(--text);border-radius:999px;padding:4px 7px;transition:background .25s,color .25s}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#0b0a10}
.chip[aria-pressed="true"] em{background:#0b0a10;color:var(--text)}

/* ---------- Ruta ---------- */
.tl{list-style:none;margin:0;padding:6px 14px calc(110px + env(safe-area-inset-bottom))}
.tl li{position:relative}
.era{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:26px 0 10px 40px}
.era::before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--line)}
.era h3{margin:0;font:900 30px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.era p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.era-p{flex:none;text-align:right}
.era-p b{display:block;font:800 15px/1 var(--f-display);letter-spacing:.1em;margin-bottom:6px}
.era-p i{display:block;width:84px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.era-p u{display:block;height:100%;width:var(--w,0%);background:linear-gradient(90deg,var(--signal),var(--gold));border-radius:3px;transition:width .8s var(--ease)}
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;padding:8px 0;transition:opacity .6s var(--ease),transform .7s var(--ease)}
.item.pre{opacity:0;transform:translateY(30px) scale(.97)}
.item::before,.item::after{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px}
.item::before{background:var(--line)}
.item::after{background:linear-gradient(var(--signal),var(--gold));transform:scaleY(0);transform-origin:top;transition:transform .8s var(--ease)}
.item.seen::after{transform:scaleY(1)}
.item.last::before,.item.last::after{bottom:50%}
.node{position:relative;z-index:1;justify-self:center;width:22px;height:22px;margin-left:0;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--c);transition:background .4s,transform .4s var(--ease)}
.node svg{display:none;width:12px;height:12px;color:#0b0a10}
.item.opt .node{border-style:dashed}
.item.seen .node{background:var(--c);transform:scale(1.15)}
.item.seen .node svg{display:block}
.item.next .node{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.card{position:relative;height:200px;border-radius:26px;overflow:hidden;isolation:isolate;background:var(--panel);
  box-shadow:0 16px 34px -16px color-mix(in srgb,var(--c) 60%,transparent),0 0 0 1px rgba(255,255,255,.09);
  transition:transform .35s var(--ease),box-shadow .35s}
.card:active{transform:scale(.975)}
.item.next .card{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 16px 34px -16px color-mix(in srgb,var(--c) 60%,transparent),0 0 0 1px rgba(255,255,255,.09)}50%{box-shadow:0 16px 44px -8px var(--c),0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}}
.art{position:absolute;inset:-14% 0;will-change:transform;transition:filter .5s}
.art svg{display:block;width:100%;height:100%}
.item.seen .art{filter:saturate(.7) brightness(.72)}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,6,12,.45) 0%,rgba(8,6,12,0) 35%,rgba(8,6,12,.9) 100%)}
.hit{position:absolute;inset:0;z-index:2;width:100%;height:100%}
.top{position:absolute;z-index:3;left:14px;top:10px;right:70px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;pointer-events:none}
.num{font:900 46px/1 var(--f-display);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.7);letter-spacing:.02em}
.tag{font:800 11px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--c);color:#fff;background:color-mix(in srgb,var(--c) 40%,rgba(8,6,12,.6));border-radius:999px;padding:4px 8px}
.tag.thread{border-color:#ff4d7e;background:rgba(255,77,126,.28)}
.tag.nx{background:var(--c);color:#0b0a10;border-color:var(--c);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.6}}
.chk{position:absolute;z-index:4;top:10px;right:10px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(8,6,12,.55);border:2px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .3s,transform .3s var(--ease),border-color .3s}
.chk:active{transform:scale(.88)}
.chk svg{width:22px;height:22px;opacity:.55;transition:opacity .3s}
.item.seen .chk svg{opacity:1}
.chk svg path{stroke-dasharray:26;stroke-dashoffset:0}
.item.seen .chk{background:var(--c);border-color:var(--c);color:#0b0a10}
.bot{position:absolute;z-index:3;left:16px;right:16px;bottom:13px;pointer-events:none}
.meta{margin:0 0 3px;font-size:12.5px;color:rgba(255,255,255,.8)}
.card h2{margin:0;font:900 clamp(26px,8vw,32px)/.94 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.foot{padding:20px 0 0 40px}
.foot p{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.reset{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.reset.arm{color:var(--signal)}
.empty{padding:44px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;font:900 32px/1 var(--f-display);text-transform:uppercase;color:var(--gold);margin-bottom:6px}

/* ---------- Sello ---------- */
.stamp{position:absolute;left:73%;top:44%;z-index:3;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-14deg);font:900 24px/1 var(--f-display);letter-spacing:.14em;color:#3dff8f;border:3px solid #3dff8f;border-radius:8px;padding:6px 10px 4px;background:rgba(3,14,8,.68);text-shadow:0 0 8px rgba(0,0,0,.5);white-space:nowrap}
.item.seen .stamp,.sheet.seen .stamp{opacity:1}
.stamp.pop{animation:stampIn .55s var(--ease) both}
.stamp.big{font-size:34px;border-width:4px;border-radius:10px;padding:8px 14px 5px;letter-spacing:.16em;top:40%}
@keyframes stampIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.8)}55%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}

/* ---------- Portadas animadas ---------- */
.a{transform-box:fill-box;transform-origin:center;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-play-state:paused}
.a.spin{animation-name:spin;animation-timing-function:linear}
.a.float{animation-name:float}
.a.pulse{animation-name:pulse}
.a.tw{animation-name:tw}
.a.sway{animation-name:sway}
.a.flick{animation-name:flick}
.a.drift{animation-name:drift;animation-direction:alternate}
.a.slidex{animation-name:slidex;animation-direction:alternate}
.a.dash{animation-name:dash;animation-timing-function:linear}
.a.flash{animation-name:flash}
.live .a,.card.in .a,.go .a{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.82}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes flick{0%,100%{opacity:1}42%{opacity:.65}50%{opacity:1}72%{opacity:.8}}
@keyframes drift{from{transform:translate(-6px,-14px)}to{transform:translate(16px,28px)}}
@keyframes slidex{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes dash{to{stroke-dashoffset:-32}}
@keyframes flash{0%,100%{opacity:.95}50%{opacity:.45}}

/* ---------- Pastilla y avisos ---------- */
.cta{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:12;display:flex;align-items:center;gap:10px;max-width:min(92vw,420px);padding:7px 18px 7px 7px;border-radius:999px;
  background:linear-gradient(100deg,color-mix(in srgb,var(--c) 34%,#0e1813),#0e1813 80%);border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 14px 34px -8px rgba(0,0,0,.8),0 0 24px -6px var(--c);
  transform:translate(-50%,140%);opacity:0;pointer-events:none;transition:transform .5s var(--ease),opacity .4s}
.cta.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.cta .go-art{width:40px;height:40px;border-radius:50%}
.cta .go-t b{font-size:18px;max-width:46vw;-webkit-line-clamp:1}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:80;max-width:min(92vw,420px);padding:12px 18px;border-radius:16px;background:rgba(14,24,19,.95);border:1px solid var(--gold);color:var(--text);font-weight:600;font-size:14.5px;text-align:center;box-shadow:0 16px 40px -10px rgba(0,0,0,.8);transform:translate(-50%,-160%);transition:transform .5s var(--ease)}
.toast.on{transform:translate(-50%,0)}
.finale{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(80% 60% at 50% 40%,rgba(43,220,120,.32),rgba(3,8,5,.92));opacity:0;pointer-events:none;transition:opacity .5s}
.finale.on{opacity:1;pointer-events:auto}
.finale h2{margin:0;font:900 clamp(54px,18vw,92px)/.88 var(--f-display);text-transform:uppercase;background:linear-gradient(100deg,#1fbf6b,#b6ffd2,#fff,#b6ffd2,#1fbf6b);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.finale p{margin:14px 0 22px;color:var(--muted);font-size:17px}
.finale button{min-height:52px;padding:0 28px;border-radius:999px;background:var(--text);color:#0b0a10;font:800 18px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.finale.on h2{animation:rise .8s var(--ease) both,shine 3s linear infinite}

/* ---------- Ficha inferior ---------- */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,4,8,.66);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;margin-inline:auto;width:min(100%,560px);height:min(92dvh,780px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;overflow:hidden;transform:translateY(106%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.sheet.drag{transition:none}
.s-head{position:relative;flex:none;height:clamp(160px,27dvh,235px);touch-action:none;cursor:grab;overflow:hidden}
.s-cover{position:absolute;inset:0;overflow:hidden}
.s-cover svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
.s-cover.from-r svg{animation:kb 14s ease-in-out infinite alternate,inR .5s var(--ease)}
.s-cover.from-l svg{animation:kb 14s ease-in-out infinite alternate,inL .5s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(60px) scale(1.1)}}
@keyframes inL{from{opacity:0;transform:translateX(-60px) scale(1.1)}}
.s-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,12,.35) 0%,rgba(8,6,12,0) 30%,rgba(8,6,12,.9) 100%)}
.grab{position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(255,255,255,.55)}
.s-close{position:absolute;top:14px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(10,8,14,.6);display:grid;place-items:center;backdrop-filter:blur(6px)}
.s-close svg{width:18px;height:18px}
.s-text{position:absolute;left:18px;right:18px;bottom:12px}
.kicker{margin:0 0 4px;font:800 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.s-text h2{margin:0;font:900 clamp(30px,9vw,40px)/.95 var(--f-display);text-transform:uppercase;text-wrap:balance;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.s-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px;-webkit-overflow-scrolling:touch}
.s-scroll.from-r>*{animation:inR .45s var(--ease) both}
.s-scroll.from-l>*{animation:inL .45s var(--ease) both}
.s-scroll.from-r>*:nth-child(2),.s-scroll.from-l>*:nth-child(2){animation-delay:.04s}
.s-scroll.from-r>*:nth-child(3),.s-scroll.from-l>*:nth-child(3){animation-delay:.08s}
.s-scroll.from-r>*:nth-child(4),.s-scroll.from-l>*:nth-child(4){animation-delay:.12s}
.s-scroll.from-r>*:nth-child(5),.s-scroll.from-l>*:nth-child(5){animation-delay:.16s}
.s-scroll.open>*{animation:rise .5s var(--ease) both}
.s-scroll.open>*:nth-child(2){animation-delay:.06s}
.s-scroll.open>*:nth-child(3){animation-delay:.12s}
.s-scroll.open>*:nth-child(4){animation-delay:.18s}
.s-scroll.open>*:nth-child(5){animation-delay:.24s}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.facts span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--muted)}
.facts span:first-child{border-color:var(--c);color:var(--c)}
.s-scroll h3{font:800 14px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin:0 0 8px}
.s-scroll p.why{margin:0 0 20px;font-size:16.5px;line-height:1.6;max-width:62ch}
.spoiler{position:relative;display:block;width:100%;text-align:left;border:1.5px dashed var(--c);border-radius:16px;padding:14px 16px 16px;background:rgba(255,255,255,.03);overflow:hidden;transition:background .4s}
.spoiler:not([aria-expanded="true"])::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.1),transparent);animation:sweep 2.8s ease-in-out infinite;pointer-events:none}
@keyframes sweep{to{left:120%}}
.sp-head{display:flex;align-items:center;gap:8px;font:800 14px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--c);margin-bottom:10px}
.sp-head svg{width:18px;height:18px}
.sp-text{display:block;font-size:16px;line-height:1.6;filter:blur(9px);user-select:none;-webkit-user-select:none;transition:filter .5s}
.sp-cta{position:absolute;left:0;right:0;top:58%;transform:translateY(-50%);text-align:center;font:800 18px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;pointer-events:none;animation:blink 1.8s ease-in-out infinite}
.spoiler[aria-expanded="true"]{background:color-mix(in srgb,var(--c) 10%,transparent)}
.spoiler[aria-expanded="true"] .sp-text{filter:none;user-select:text;-webkit-user-select:text}
.spoiler[aria-expanded="true"] .sp-cta{display:none}
.s-foot{flex:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);display:grid;gap:10px}
.mark{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;border:2px solid var(--c);color:var(--c);font:800 20px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;transition:background .35s,color .35s,transform .2s}
.mark:active{transform:scale(.97)}
.mark svg{width:22px;height:22px}
.mark svg path{stroke-dasharray:26;stroke-dashoffset:0}
.mark.draw svg path{animation:draw .5s .05s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:26}to{stroke-dashoffset:0}}
.mark[aria-pressed="true"]{background:var(--c);color:#0b0a10}
.mark .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.navbtn{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:52px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;justify-content:center;transition:transform .2s,background .2s}
.navbtn:active{transform:scale(.96)}
.navbtn.right{text-align:right}
.navbtn small{font:800 12px/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.navbtn span{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn:disabled{opacity:.35;cursor:default}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}


/* ---------- Vida: fondo, runas, insignias, brillo ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.2;background:#16c25f;animation:blob 18s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:320px;height:320px;left:-130px;top:30%}
.bgfx i:nth-child(2){width:260px;height:260px;right:-110px;top:62%;background:#0f9a72;animation-duration:25s}
@keyframes blob{to{transform:translate(70px,-110px) scale(1.25)}}
.app{position:relative;z-index:1}
.rune{position:absolute;right:-120px;top:-80px;width:380px;height:380px;opacity:.3;pointer-events:none;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tagline{margin:-8px 0 18px;font-size:14px;color:var(--muted);animation:rise .8s .12s var(--ease) both}
.hero h1 span{filter:drop-shadow(0 0 14px rgba(43,220,120,.55));animation:shine 5s linear infinite,flameGlow 3.2s ease-in-out infinite}
@keyframes flameGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(43,220,120,.45))}50%{filter:drop-shadow(0 0 22px rgba(43,220,120,.85))}}
.cd div{position:relative}
.cd div::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--signal),transparent);background-size:200% 100%;animation:ember 2.6s linear infinite}
@keyframes ember{to{background-position:-200% 0}}
.item::after{background:linear-gradient(var(--signal),var(--gold),var(--signal));background-size:100% 220%;animation:flow 2.2s linear infinite}
@keyframes flow{to{background-position:0 -220%}}
.card{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:active{transform:perspective(800px) scale(.975)}
.card::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,-40%),rgba(255,255,255,.24),transparent 62%)}
.card:hover::after,.card.glare::after{opacity:1}
.item.next .card::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.18) 50%,transparent 62%);transform:translateX(-130%);animation:sweepCard 3.6s ease-in-out infinite}
@keyframes sweepCard{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.glyph{position:absolute;z-index:3;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(3,12,8,.55);border:1.5px solid var(--c);color:var(--c);pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 0 18px -4px var(--c);animation:bob 4s ease-in-out infinite}
.glyph svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
.bot{right:74px!important}
.s-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rune,.bgfx i,.glyph{animation:none!important}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .a{animation:none!important}
  .item.pre{opacity:1;transform:none}
}
</style>

 {id:'ws',eraId:'inf',title:'Capitán América: El Soldado de Invierno',short:'El Soldado de Invierno',year:2014,kind:'Película',min:136,

 {id:'ultron',eraId:'inf',title:'Los Vengadores: La era de Ultrón',short:'La era de Ultrón',year:2015,kind:'Película',min:141,

 {id:'cw',eraId:'inf',title:'Capitán América: Civil War',short:'Civil War',year:2016,kind:'Película',min:147,

 {id:'endgame',eraId:'inf',title:'Vengadores: Endgame',short:'Endgame',year:2019,kind:'Película',min:181,

 {id:'wandavision',eraId:'mv',thread:'1/3',title:'WandaVision',short:'WandaVision',year:2021,kind:'Serie',eps:9,min:340,

  why:'Wanda procesa su duelo convirtiendo Westview en una sitcom. Aquí nace la Bruja Escarlata, aparece la Darkhold y empieza la historia de sus hijos, Billy y Tommy, que sigue en Agatha ¿quién si no? y VisionQuest.',

 {id:'loki1',eraId:'mv',title:'Loki · Temporada 1',short:'Loki T1',year:2021,kind:'Serie',eps:6,min:250,

 {id:'nwh',eraId:'mv',title:'Spider-Man: No Way Home',short:'No Way Home',year:2021,kind:'Película',min:148,

 {id:'mom',eraId:'mv',title:'Doctor Strange en el multiverso de la locura',short:'Multiverso de la locura',year:2022,kind:'Película',min:126,

 {id:'loki2',eraId:'mv',title:'Loki · Temporada 2',short:'Loki T2',year:2023,kind:'Serie',eps:6,min:300,

 {id:'dw',eraId:'mv',title:'Deadpool y Wolverine',short:'Deadpool y Wolverine',year:2024,kind:'Película',min:128,

 {id:'agatha',eraId:'mv',thread:'2/3',title:'Agatha ¿quién si no?',short:'Agatha ¿quién si no?',year:2024,kind:'Serie',eps:9,min:360,

 {id:'tb',eraId:'mv',title:'Thunderbolts*',short:'Thunderbolts*',year:2025,kind:'Película',min:127,

const state = {seen:{},filter:'all'};
(function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){if(s.seen&&typeof s.seen==='object')state.seen=s.seen;if(['all','pending','seen'].includes(s.filter))state.filter=s.filter}}catch(e){}})();

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

function fmtDur(m){const h=Math.floor(m/60),r=Math.round(m%60);return h?(r?`${h} h ${r} min`:`${h} h`):`${r} min`}
const passes = it => state.filter==='pending'?!state.seen[it.id]:state.filter==='seen'?!!state.seen[it.id]:true;
const visible = () => ITEMS.filter(passes);
const nextItem = () => ITEMS.find(i=>!i.opt&&!state.seen[i.id]);
const haptic = ms => {try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>';
let io=null,ioView=null,visCards=new Set();
function renderList(){
  const vis = visible(), list = $('#list'), nx = nextItem();
  if(!vis.length){list.innerHTML=`<li class="empty"><b>${state.filter==='seen'?'Aún no hay vistas':'Todo visto'}</b>${state.filter==='seen'?'Marca un título con el círculo de su tarjeta.':'No te queda ningún título. Estás listo para Doomsday.'}</li>`;observe();return}
  let html='', lastEra=null;
  vis.forEach((it,i)=>{
    if(it.eraId!==lastEra){const e=ERAS[it.eraId];html+=`<li class="era" style="--c:${it.pal.c}"><div><h3>${e.title}</h3><p>${e.range}</p></div><div class="era-p"><b data-ep="${it.eraId}">0/0</b><i><u data-eu="${it.eraId}"></u></i></div></li>`;lastEra=it.eraId}
    const isLast=i===vis.length-1;
    const cls=['item',isLast?'last':'',it.opt?'opt':'',state.seen[it.id]?'seen':'',nx&&nx.id===it.id?'next':''].filter(Boolean).join(' ');
    const meta=`${it.kind}${it.eps?` · ${it.eps} ep.`:''} · ${it.year} · ≈ ${fmtDur(it.min)}`;
    html+=`<li class="${cls}" data-li="${it.id}" style="--c:${it.pal.c};--d:${it.pal.d}">
      <span class="node" aria-hidden="true">${CHECK}</span>
      <div class="card">
        <div class="art">${coverSVG(it)}</div><div class="shade"></div>
        <button class="hit" data-open="${it.id}" aria-label="Abrir ficha de ${it.title}"></button>
        <div class="top">${it.opt?'<span class="tag">Opcional</span>':`<span class="num">${pad(it.num)}</span>`}${it.thread?`<span class="tag thread">Hilo de Wanda ${it.thread}</span>`:''}<span class="tag nx" hidden>Siguiente</span></div>
        <button class="chk" data-toggle="${it.id}" aria-pressed="${!!state.seen[it.id]}" aria-label="Marcar ${it.short} como vista">${CHECK}</button>
        <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24">${GLYPH[it.id]}</svg></span>

  html+=`<li class="foot"><p>Orden cronológico por fecha de estreno. Las duraciones son aproximadas.</p><button class="reset" id="reset">Reiniciar progreso</button></li>`;

  if(!reduce.matches){list.querySelectorAll('.item').forEach(li=>{if(li.getBoundingClientRect().top>innerHeight)li.classList.add('pre')})}

function updateEras(){
  Object.keys(ERAS).forEach(k=>{const ess=ITEMS.filter(i=>!i.opt&&i.eraId===k),n=ess.filter(i=>state.seen[i.id]).length;
    const b=document.querySelector(`[data-ep="${k}"]`),u=document.querySelector(`[data-eu="${k}"]`);
    if(b)b.textContent=`${n}/${ess.length}`;if(u)u.style.setProperty('--w',(ess.length?n/ess.length*100:0)+'%')});
}
function paintItem(id,pop){
  const li=document.querySelector(`[data-li="${id}"]`);if(!li)return;
  const on=!!state.seen[id];li.classList.toggle('seen',on);
  li.querySelector('.chk').setAttribute('aria-pressed',on);
  if(on&&pop){const s=li.querySelector('.stamp');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}
}
function paintNext(){
  const nx=nextItem();
  document.querySelectorAll('.item').forEach(li=>{const is=nx&&li.dataset.li===nx.id;li.classList.toggle('next',!!is);const t=li.querySelector('.tag.nx');if(t)t.hidden=!is});
  [['goHero',$('#goHero')],['goCta',$('#goCta')]].forEach(([,b])=>{
    if(!nx){b.hidden=true;return}
    b.hidden=false;b.style.setProperty('--c','#2bdc78');b.dataset.id=nx.id;
    b.innerHTML=`<span class="go-art">${coverSVG(nx)}</span><span class="go-t"><small>${state.seen[ITEMS[0].id]||ITEMS.some(i=>state.seen[i.id])?'Siguiente en tu ruta':'Empieza aquí'}</small><b>${nx.short}</b></span><svg class="go-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
  });

/* Observadores: animar portadas visibles y mover el fondo de cada tarjeta (parallax) */
function observe(){
  if(io)io.disconnect();visCards.clear();
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.item.pre').forEach(l=>l.classList.remove('pre'));return}
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const li=e.target;
    if(e.isIntersecting){li.classList.remove('pre');visCards.add(li);li.querySelector('.card').classList.toggle('in',e.intersectionRatio>.45)}
    else{visCards.delete(li);li.querySelector('.card').classList.remove('in')}
    }),{threshold:[0,.45,.8]});
  document.querySelectorAll('.item').forEach(li=>io.observe(li));
  setTimeout(()=>document.querySelectorAll('.item.pre').forEach(l=>l.classList.remove('pre')),2200);
  parallax();
}
let pTick=false;
function parallax(){
  if(reduce.matches)return;
  visCards.forEach(li=>{const c=li.querySelector('.card'),a=li.querySelector('.art');if(!a)return;
    const r=c.getBoundingClientRect(),off=(r.top+r.height/2-innerHeight/2)/innerHeight;
    a.style.transform=`translate3d(0,${Math.max(-26,Math.min(26,-off*52)).toFixed(1)}px,0)`});
}
addEventListener('scroll',()=>{if(pTick)return;pTick=true;requestAnimationFrame(()=>{pTick=false;parallax()})},{passive:true});

/* ======================= CABECERA ======================= */
const C = 2*Math.PI*50;
let first=true,lastSeenN=-1,lastPend=-1;
function countTo(el,to,dur,fmt){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.innerHTML=fmt(Math.round(to*e));if(k<1)requestAnimationFrame(f)})(t0)}
function hrsHTML(m){const h=Math.floor(m/60),mm=m%60;return m?`${h}<i>h</i>${pad(mm)}<i>min</i>`:`0<i>h</i>`}
function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function updateStats(){
  const ess=ITEMS.filter(i=>!i.opt),seen=ess.filter(i=>state.seen[i.id]).length;
  const pendMin=ess.filter(i=>!state.seen[i.id]).reduce((a,i)=>a+i.min,0);
  requestAnimationFrame(()=>{$('#ringFg').style.strokeDashoffset=C*(1-seen/TOTAL)});
  $('#ringN').textContent=seen;$('#ringS').textContent=`de ${TOTAL}`;
  $('#ring').classList.toggle('done',seen===TOTAL);
  $('#ring').setAttribute('aria-label',`${seen} de ${TOTAL} títulos esenciales vistos`);
  if(first&&!reduce.matches&&pendMin)countTo($('#hrs'),pendMin,1100,hrsHTML);else $('#hrs').innerHTML=hrsHTML(pendMin);
  if(!first&&pendMin!==lastPend)bump($('#hrs'));
  if(!first&&seen!==lastSeenN)bump($('#ringN'));
  first=false;lastSeenN=seen;lastPend=pendMin;
  $('#lbl').textContent=pendMin?'Te faltan por ver':'Roadmap completo';
  const days=(PREMIERE-new Date())/864e5;
  let pace;
  if(!pendMin) pace='Lo has visto todo. Estás listo para Avengers: Doomsday.';
  else if(days<=0) pace='El estreno ya llegó. Ponte al día a tu ritmo.';
  else pace=`≈ ${fmtDur(Math.max(1,Math.round(pendMin/days)))} al día para llegar a tiempo`;
  $('#pace').textContent=pace;
  $('#nAll').textContent=ITEMS.length;
  $('#nPen').textContent=ITEMS.filter(i=>!i.opt&&!state.seen[i.id]).length;
  $('#nOpt').textContent=ITEMS.filter(i=>state.seen[i.id]).length;
  updateEras();
}
const cdEls={D:$('#cdD'),H:$('#cdH'),M:$('#cdM'),S:$('#cdS')};
function setCd(k,v){const el=cdEls[k];if(el.textContent!==v){el.textContent=v;if(!reduce.matches){el.classList.remove('roll');void el.offsetWidth;el.classList.add('roll')}}}
function tick(){
  let ms=PREMIERE-new Date();const out=ms<=0;if(out)ms=0;
  const s=Math.floor(ms/1000);
  setCd('D',String(Math.floor(s/86400)));setCd('H',pad(Math.floor(s%86400/3600)));setCd('M',pad(Math.floor(s%3600/60)));setCd('S',pad(s%60));
  $('#cdLabel').innerHTML=out?'<strong>Avengers: Doomsday ya está en cines</strong>':'Hasta el estreno · <strong>18 de diciembre de 2026</strong>';
}
/* Brasas verdes de la cabecera */
const sc=$('#stars'),sx=sc.getContext('2d');let stars=[],heroVis=true,sraf=0,sd=1,sw=0,sh=0;
function initStars(){const r=sc.getBoundingClientRect();sd=Math.min(devicePixelRatio||1,2);sw=r.width;sh=r.height;sc.width=sw*sd;sc.height=sh*sd;const R=rng(7);stars=Array.from({length:72},(_,i)=>({x:R()*sw,y:R()*sh,r:.6+R()*1.9,v:.12+R()*.5,p:R()*6.28,w:.4+R()*1.2,ember:i%3!==0}))}
function drawStars(t){sx.clearRect(0,0,sc.width,sc.height);const sy=scrollY*.25,mv=!reduce.matches;
  for(const s of stars){
    if(s.ember&&mv){s.y-=s.v;if(s.y<-10){s.y=sh+10;s.x=Math.random()*sw}s.x+=Math.sin(t/1200*s.w+s.p)*.25}
    const y=((s.y-sy*s.r*.4)%sh+sh)%sh,a=.25+.75*(.5+.5*Math.sin(t/700*s.w+s.p));
    if(s.ember){sx.fillStyle=`rgba(60,255,150,${(a*.18).toFixed(3)})`;sx.beginPath();sx.arc(s.x*sd,y*sd,s.r*3.2*sd,0,6.283);sx.fill();sx.fillStyle=`rgba(190,255,215,${a.toFixed(3)})`}
    else sx.fillStyle=`rgba(255,255,255,${(a*.7).toFixed(3)})`;
    sx.beginPath();sx.arc(s.x*sd,y*sd,s.r*.8*sd,0,6.283);sx.fill()}}
function starLoop(t){drawStars(t);sraf=heroVis&&!reduce.matches?requestAnimationFrame(starLoop):0}
function startStars(){initStars();if(reduce.matches){drawStars(0);return}if(!sraf)sraf=requestAnimationFrame(starLoop)}

/* ======================= PASTILLA ======================= */
let heroInView=true;
function syncCta(){const b=$('#goCta');const show=!b.hidden&&!heroInView&&!sheet.classList.contains('on');b.classList.toggle('on',show);b.tabIndex=show?0:-1}
if('IntersectionObserver' in window){new IntersectionObserver(es=>{heroInView=es[0].isIntersecting;heroVis=heroInView;if(heroVis&&!sraf&&!reduce.matches)sraf=requestAnimationFrame(starLoop);syncCta()},{threshold:0}).observe($('#hero'))}

/* ======================= AVISOS ======================= */
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function milestone(id){
  const it=byId[id],ess=ITEMS.filter(i=>!i.opt),seen=ess.filter(i=>state.seen[i.id]).length;
  if(it.opt){toast(`Opcional vista: ${it.short}`);return}
  if(seen===TOTAL){setTimeout(finale,500);return}
  const era=ess.filter(i=>i.eraId===it.eraId);
  if(era.every(i=>state.seen[i.id])){toast(`${ERAS[it.eraId].title} completa`);return}
  if(seen===Math.ceil(TOTAL/2)){toast('Mitad del camino recorrida');return}
  toast(`${it.short} vista · te quedan ${TOTAL-seen}`);
}
function finale(){
  const f=$('#finale');f.classList.add('on');f.setAttribute('aria-hidden','false');app.inert=true;$('#finX').focus({preventScroll:true});
  let n=0;const id=setInterval(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.35),['#2bdc78','#b6ffd2','#ffffff','#1fbf6b','#7dffb0']);if(++n>6)clearInterval(id)},380);
}
function closeFinale(){const f=$('#finale');f.classList.remove('on');f.setAttribute('aria-hidden','true');if(!sheet.classList.contains('on'))app.inert=false}
$('#finX').addEventListener('click',closeFinale);$('#finale').addEventListener('click',e=>{if(e.target.id==='finale')closeFinale()});

/* ======================= FICHA ======================= */
const sheet=$('#sheet'),scrim=$('#scrim'),app=$('#app');
let cur=null,nav=[],lastTrigger=null;
function openSheet(id,trigger){
  nav=visible().map(i=>i.id);if(!nav.includes(id))nav=ITEMS.map(i=>i.id);
  lastTrigger=trigger||null;fill(id,0);
  const sc2=$('#shScroll');sc2.classList.remove('from-r','from-l');sc2.classList.add('open');
  scrim.classList.add('on');sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');app.inert=true;syncCta();
  setTimeout(()=>{$('#shClose').focus({preventScroll:true});fxStart(byId[cur])},80);
}
function closeSheet(){
  if(!sheet.classList.contains('on'))return;
  fxStop();sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');app.inert=false;
  renderList();updateStats();paintNext();
  const t=document.querySelector(`[data-open="${cur}"]`)||lastTrigger;if(t){try{t.focus({preventScroll:true})}catch(e){}}
}
function fill(id,dir){
  const it=byId[id];cur=id;const p=it.pal;
  sheet.style.setProperty('--c',p.c);sheet.style.setProperty('--d',p.d);
  const cv2=$('#shCover');cv2.className='s-cover live'+(dir&&!reduce.matches?(dir>0?' from-r':' from-l'):'');
  cv2.innerHTML=coverSVG(it);
  if(dir)fxStart(it);
  $('#shKicker').textContent=it.opt?'Opcional':`${pad(it.num)} / ${TOTAL} · ${ERAS[it.eraId].title}`;
  $('#shTitle').textContent=it.title;
  $('#shFacts').innerHTML=`<span>${it.kind}${it.eps?` · ${it.eps} episodios`:''} · ${it.year}</span><span>≈ ${fmtDur(it.min)}</span>${it.thread?`<span>Hilo de Wanda ${it.thread}</span>`:''}`;
  $('#shWhy').textContent=it.why;
  $('#shSpText').textContent=it.spoiler;
  setSpoiler(false);setSeenUI(false);
  const i=nav.indexOf(id),pv=byId[nav[i-1]],nx=byId[nav[i+1]];
  $('#shPrev').disabled=!pv;$('#shNext').disabled=!nx;
  $('#shPrevT').textContent=pv?pv.short:'Inicio del camino';$('#shNextT').textContent=nx?nx.short:'Fin de la lista';
  const sc2=$('#shScroll');sc2.scrollTop=0;
  if(dir&&!reduce.matches){sc2.classList.remove('open','from-r','from-l');void sc2.offsetWidth;sc2.classList.add(dir>0?'from-r':'from-l')}
}
function setSeenUI(pop){
  const on=!!state.seen[cur];sheet.classList.toggle('seen',on);
  const m=$('#shMark');m.setAttribute('aria-pressed',on);$('#shMarkTxt').textContent=on?'Vista · Quitar':'Marcar como vista';
  m.classList.remove('draw');if(on&&pop){void m.offsetWidth;m.classList.add('draw')}
  if(on&&pop){const s=$('#shStamp');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}
}
function setSpoiler(open){const b=$('#shSpoiler');b.setAttribute('aria-expanded',open);$('#shSpText').setAttribute('aria-hidden',!open)}
function go(d){const i=nav.indexOf(cur)+d;if(i<0||i>=nav.length)return;haptic(8);fill(nav[i],d)}
function toggleSeen(id,origin,evt){
  state.seen[id]=!state.seen[id];if(!state.seen[id])delete state.seen[id];
  save();updateStats();
  const on=!!state.seen[id];
  if(on){
    const r=origin.getBoundingClientRect(),p=byId[id].pal;
    burst(r.left+r.width/2,r.top+r.height/2,[p.c,p.d,p.t,'#ffffff','#3dff8f']);haptic([12,40,18]);
    if(origin.id==='shMark'&&evt&&!reduce.matches){const rp=document.createElement('span');rp.className='rip';const s=Math.max(r.width,r.height)/4;rp.style.cssText=`width:${s}px;height:${s}px;left:${evt.clientX-r.left-s/2}px;top:${evt.clientY-r.top-s/2}px`;origin.appendChild(rp);setTimeout(()=>rp.remove(),650)}
    milestone(id);
  }
  if(state.filter==='pending'&&on&&!sheet.classList.contains('on')){paintItem(id,true);setTimeout(()=>{renderList();paintNext()},800)}
  else paintItem(id,on);
  paintNext();
  if(sheet.classList.contains('on')&&cur===id)setSeenUI(on);
}

/* ======================= PARTÍCULAS DE LA FICHA ======================= */
const fx=$('#shFx'),fxc=fx.getContext('2d');let fxp=[],fxr=0,fxW=0,fxH=0,fxMode='up',fxCols=['#fff'],fxD=1;
const FXMODE={ws:'down',ultron:'up',cw:'up',infinity:'down',endgame:'up',wandavision:'float',loki1:'bits',nwh:'up',mom:'float',loki2:'up',dw:'up',agatha:'float',tb:'up',f4:'float',visionquest:'bits'};
function fxStop(){cancelAnimationFrame(fxr);fxr=0;fxc.clearRect(0,0,fx.width,fx.height)}
function fxStart(it){
  fxStop();if(reduce.matches)return;
  fxD=Math.min(devicePixelRatio||1,2);fxW=fx.offsetWidth||360;fxH=fx.offsetHeight||200;fx.width=fxW*fxD;fx.height=fxH*fxD;
  fxMode=FXMODE[it.id]||'up';fxCols=[it.pal.c,it.pal.d,'#ffffff'];
  const R=rng(it.num*13+it.year);
  fxp=Array.from({length:44},()=>({x:R()*fxW,y:R()*fxH,r:.8+R()*2.2,vx:(R()-.5)*.5,vy:.3+R()*.9,ph:R()*6.28,c:fxCols[Math.floor(R()*3)],ch:R()>.5?'1':'0'}));
  const loop=t=>{
    fxc.clearRect(0,0,fx.width,fx.height);
    for(const p of fxp){
      if(fxMode==='up'){p.y-=p.vy;p.x+=Math.sin(t/800+p.ph)*.35}
      else if(fxMode==='down'){p.y+=p.vy*.8;p.x+=.25+Math.sin(t/900+p.ph)*.2}
      else if(fxMode==='bits'){p.y+=p.vy*1.1}
      else{p.x+=Math.sin(t/1100+p.ph)*.5;p.y+=Math.cos(t/1300+p.ph)*.4}
      if(p.y<-8)p.y=fxH+8;if(p.y>fxH+8)p.y=-8;if(p.x<-8)p.x=fxW+8;if(p.x>fxW+8)p.x=-8;
      const a=.35+.65*(.5+.5*Math.sin(t/600+p.ph));
      fxc.globalAlpha=a;fxc.fillStyle=p.c;
      if(fxMode==='bits'){fxc.font=`${10*fxD}px ui-monospace,Menlo,monospace`;fxc.fillText(p.ch,p.x*fxD,p.y*fxD)}
      else{fxc.beginPath();fxc.arc(p.x*fxD,p.y*fxD,p.r*fxD,0,6.283);fxc.fill();fxc.globalAlpha=a*.25;fxc.beginPath();fxc.arc(p.x*fxD,p.y*fxD,p.r*3*fxD,0,6.283);fxc.fill()}
    }
    fxr=requestAnimationFrame(loop);
  };
  fxr=requestAnimationFrame(loop);
}
/* ======================= CONFETI ======================= */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0,dpr=1;
function sizeCv(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr}
function burst(x,y,colors){
  if(reduce.matches)return;sizeCv();
  for(let i=0;i<120;i++){const a=-Math.PI/2+(Math.random()-.5)*2.6,v=6+Math.random()*10;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*5,rot:Math.random()*6.28,vr:(Math.random()-.5)*.45,c:colors[i%colors.length],life:0,max:80+Math.random()*60})}
  if(!raf)raf=requestAnimationFrame(frame);
}
function frame(){
  cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.life<p.max);
  for(const p of parts){p.vy+=.34;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life++;
    cx.save();cx.globalAlpha=Math.min(1,(p.max-p.life)/25);cx.translate(p.x*dpr,p.y*dpr);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w*dpr/2,-p.h*dpr/2,p.w*dpr,p.h*dpr);cx.restore()}
  if(parts.length)raf=requestAnimationFrame(frame);else{raf=0;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ======================= EVENTOS ======================= */
$('#list').addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle]');if(t){toggleSeen(t.dataset.toggle,t,e);return}
  const o=e.target.closest('[data-open]');if(o){openSheet(o.dataset.open,o);return}
  const r=e.target.closest('#reset');if(r){
    if(r.classList.contains('arm')){state.seen={};save();renderList();updateStats();paintNext();toast('Progreso reiniciado')}
    else{r.classList.add('arm');r.textContent='¿Seguro? Toca otra vez para borrar';setTimeout(()=>{r.classList.remove('arm');r.textContent='Reiniciar progreso'},3500)}
  }
});
['#goHero','#goCta'].forEach(s=>$(s).addEventListener('click',e=>{const b=e.currentTarget;openSheet(b.dataset.id,b)}));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  state.filter=c.dataset.f;save();syncChips();renderList();paintNext();
  const top=document.querySelector('.filters').offsetTop;if(scrollY>top)window.scrollTo({top,behavior:'auto'});
}));
function syncChips(){document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===state.filter))}
$('#shClose').addEventListener('click',closeSheet);
scrim.addEventListener('click',closeSheet);
$('#shSpoiler').addEventListener('click',()=>{const o=$('#shSpoiler').getAttribute('aria-expanded')!=='true';setSpoiler(o);if(o)haptic(10)});
$('#shMark').addEventListener('click',e=>toggleSeen(cur,e.currentTarget,e));
$('#shPrev').addEventListener('click',()=>go(-1));
$('#shNext').addEventListener('click',()=>go(1));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#finale').classList.contains('on')){closeFinale();return}
  if(!sheet.classList.contains('on'))return;
  if(e.key==='Escape')closeSheet();
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='ArrowRight')go(1);
});

// Brillo e inclinación de las tarjetas al apuntar o tocar
(function(){const L=$('#list');let gt=0;
  L.addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c||e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg');c.style.setProperty('--ry',((x-.5)*9).toFixed(2)+'deg')});
  L.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget)){c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')}});
  L.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||e.pointerType!=='touch')return;const r=c.getBoundingClientRect();
    c.style.setProperty('--mx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');c.style.setProperty('--my',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');c.classList.add('glare');clearTimeout(gt);gt=setTimeout(()=>c.classList.remove('glare'),450)});
})();
// Deslizar a los lados en la ficha para cambiar de título
(function(){const el=$('#shScroll');let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});
  el.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dy)<45)go(dx<0?1:-1)},{passive:true});
})();
// Arrastrar hacia abajo desde la cabecera de la ficha para cerrarla
(function(){const h=$('#shHead');let y0=null,dy=0;
  h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;h.setPointerCapture(e.pointerId);sheet.classList.add('drag')});
  h.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform=`translateY(${dy}px)`});
  const end=()=>{if(y0===null)return;y0=null;sheet.classList.remove('drag');if(dy>110)closeSheet();else sheet.style.transform=''};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
})();
addEventListener('resize',()=>{if(parts.length)sizeCv();initStars()});

/* ======================= ARRANQUE ======================= */
syncChips();renderList();updateStats();paintNext();tick();startStars();
setInterval(tick,1000);
setInterval(updateStats,60000);
</script>
</body>
